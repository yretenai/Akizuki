[workspace]
resolver = "2"
members = ["akizuki", "akizuki_macro", "akizuki_common", "akizuki_cli", "cli/unpack", "cli/ship", "cli/versions", "cli/viewer"]

[workspace.package]
authors = ["Legiayayana"]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/yretenai/Akizuki#rust"

[profile.dev]
split-debuginfo = "packed"

[profile.release]
codegen-units = 1
incremental = true
lto = true
split-debuginfo = "packed"
debug = 1

[profile.release-with-debug]
inherits = "release"
debug = true

[patch.crates-io]
bcdec_rs = { git = 'https://github.com/yretenai/image_dds.git' }
